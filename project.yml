name: RainAgentDemo
options:
  bundleIdPrefix: com.lazer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # One package vending a product per provider: rain-core-ios, rain-portal-ios, rain-privy-ios.
  RainSDK:
    # Head of SignifyHQ/rain-sdk-ios#27 (a cross-fork PR, so the branch lives on the fork), plus
    # the Auth Pull work stacked on top of it.
    url: https://github.com/lazerfocused/rain-sdk-ios.git
    branch: feature/auth_pull_impl
  Privy:
    url: https://github.com/privy-io/privy-ios
    from: 2.14.0
  # Turnkey's own SDK: the app drives auth (email OTP via the auth proxy) and hands Rain the
  # authenticated TurnkeyContext. Pinned to the version rain-core-ios resolves.
  TurnkeySwift:
    url: https://github.com/tkhq/swift-sdk.git
    exactVersion: 4.0.0
  BigInt:
    url: https://github.com/attaswift/BigInt.git
    from: 5.3.0

targets:
  RainAgentDemo:
    type: application
    platform: iOS
    sources:
      - path: RainAgentDemo
    dependencies:
      - package: RainSDK
        product: rain-core-ios
      - package: RainSDK
        product: rain-privy-ios
      - package: Privy
        product: Privy
      - package: TurnkeySwift
        product: TurnkeySwift
      - package: BigInt
        product: BigInt
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.lazer.rainagentdemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
